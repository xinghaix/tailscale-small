name: Build minimal Tailscale packages

on:
  workflow_dispatch:
    inputs:
      tailscale_ref:
        description: 'Tailscale ref/tag to build. Empty = latest upstream tag.'
        required: false
        default: ''
      force:
        description: 'Build even if the release already exists.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    # 每月 1 日检查一次上游 Tailscale 最新稳定版；本仓库没有同名 release 时才构建发布。
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tailscale_ref: ${{ steps.resolve.outputs.tailscale_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve upstream Tailscale version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.tailscale_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REF:-}" ]; then
            ref="$INPUT_REF"
          else
            ref=$(git ls-remote --tags --refs https://github.com/tailscale/tailscale.git 'v*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1)
          fi
          release_tag="$ref"
          should_build=true
          if [ "${FORCE:-false}" != "true" ] && gh release view "$release_tag" >/dev/null 2>&1; then
            should_build=false
          fi
          echo "tailscale_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "resolved ref=$ref release=$release_tag should_build=$should_build"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-amd64, goos: linux, goarch: amd64 }
          - { name: linux-386, goos: linux, goarch: '386' }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: linux-arm-v7, goos: linux, goarch: arm, goarm: '7' }
          - { name: linux-arm-v6, goos: linux, goarch: arm, goarm: '6' }
          - { name: linux-arm-v5, goos: linux, goarch: arm, goarm: '5' }
          - { name: linux-mipsle-softfloat, goos: linux, goarch: mipsle, gomips: softfloat }
          - { name: linux-mips-softfloat, goos: linux, goarch: mips, gomips: softfloat }
          - { name: linux-mips64le-softfloat, goos: linux, goarch: mips64le, gomips64: softfloat }
          - { name: linux-riscv64, goos: linux, goarch: riscv64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - name: Build package
        run: |
          set -euo pipefail
          args="--ref '${{ needs.resolve.outputs.tailscale_ref }}' --goos '${{ matrix.target.goos }}' --goarch '${{ matrix.target.goarch }}' --out dist"
          if [ -n "${{ matrix.target.goarm }}" ]; then args="$args --goarm '${{ matrix.target.goarm }}'"; fi
          if [ -n "${{ matrix.target.gomips }}" ]; then args="$args --gomips '${{ matrix.target.gomips }}'"; fi
          if [ -n "${{ matrix.target.gomips64 }}" ]; then args="$args --gomips64 '${{ matrix.target.gomips64 }}'"; fi
          eval ".github/workflows/build-package.sh $args"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-small-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          cp artifacts/* release-files/
          cp tsmanager.sh release-files/tsmanager.sh
          ls -lh release-files
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TAILSCALE_REF: ${{ needs.resolve.outputs.tailscale_ref }}
        run: |
          set -euo pipefail
          title="tailscale-small ${TAILSCALE_REF}"
          notes="Minimal Tailscale packages built from official tailscale/tailscale ${TAILSCALE_REF}. Packages contain only tailscale and tailscaled -> tailscale."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                tailscale-small_*.txt|*.sha256|SHA256SUMS)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --title "$title" --notes "$notes"
          fi
      - name: Publish jsDelivr CDN branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TAILSCALE_REF: ${{ needs.resolve.outputs.tailscale_ref }}
        run: |
          set -euo pipefail
          git config --global user.name "xinghaix"
          git config --global user.email "xinghaix@github.com"

          cd "$RUNNER_TEMP"
          rm -rf tailscale-small-cdn
          if git clone --depth 1 --branch cdn "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tailscale-small-cdn 2>/dev/null; then
            cd tailscale-small-cdn
          else
            mkdir tailscale-small-cdn
            cd tailscale-small-cdn
            git init
            git checkout -b cdn
          fi

          mkdir -p "$RELEASE_TAG" latest
          rm -f "$RELEASE_TAG"/tailscale-small_*.txt "$RELEASE_TAG"/*.sha256 "$RELEASE_TAG"/SHA256SUMS "$RELEASE_TAG"/tailscale-manager.sh
          cp "$GITHUB_WORKSPACE"/release-files/* "$RELEASE_TAG"/
          cp "$GITHUB_WORKSPACE"/release-files/tsmanager.sh latest/tsmanager.sh

          rm -f latest/tailscale-small_latest_*.tar.gz latest/tailscale-small_latest_*.txt latest/*.sha256 latest/SHA256SUMS latest/tailscale-manager.sh
          for f in "$GITHUB_WORKSPACE"/release-files/tailscale-small_${TAILSCALE_REF}_*.tar.gz; do
            base=$(basename "$f")
            latest_base=${base/$TAILSCALE_REF/latest}
            cp "$f" "latest/$latest_base"
          done

          git add .
          if git diff --cached --quiet; then
            echo "CDN branch already up to date"
            exit 0
          fi
          git commit -m "Publish ${RELEASE_TAG} CDN files"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:cdn
